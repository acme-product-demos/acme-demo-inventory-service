$kind: http-example
name: Reserved One Unit
request:
  url: '{{baseUrl}}/api/inventory/p1/reserve'
  method: POST
  body:
    type: json
    content: |-
      {
        "quantity": 1
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "productId": "p1",
        "sku": "SKU-P1-HEADPHN",
        "quantityAvailable": 24,
        "warehouse": "US-EAST-1"
      }
order: 1000
