$kind: http-example
name: Quantity Set
request:
  url: '{{baseUrl}}/api/inventory/p1'
  method: PUT
  body:
    type: json
    content: |-
      {
        "quantityAvailable": 25
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "productId": "p1",
        "sku": "SKU-P1-HEADPHN",
        "quantityAvailable": 25,
        "warehouse": "US-EAST-1"
      }
order: 1000
