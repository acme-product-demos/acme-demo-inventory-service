$kind: http-request
method: GET
url: '{{baseUrl}}/health'
order: 1000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('body reports ok status and correct service name', function () {
        var body = pm.response.json();
        pm.expect(body.status).to.eql('ok');
        pm.expect(body.service).to.eql('inventory-service');
      });
examples: './.resources/Health Check.resources/examples/'
