$kind: http-request
method: GET
url: '{{baseUrl}}/api/inventory'
order: 2000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('returns a non-empty array of inventory records', function () {
        var body = pm.response.json();
        pm.expect(body).to.be.an('array');
        pm.expect(body.length).to.be.above(0);
        pm.expect(body[0]).to.have.all.keys('productId', 'sku', 'quantityAvailable', 'warehouse');
      });
examples: './.resources/List Inventory.resources/examples/'
